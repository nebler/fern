# Runs the same scripts as the lab, so CI and the Mac use the same pinned
# containers (golang:1.27, golangci-lint, shellcheck, hadolint, sqlc).
# Actions are pinned to commits; Dependabot keeps them current.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A new push to a pull request cancels its run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # lab/go.sh keeps Go's caches here instead of in Docker volumes, so
  # actions/cache can keep them between runs.
  FERN_GOMODCACHE: /home/runner/go-mod
  FERN_GOCACHE: /home/runner/go-build
jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go-mod
            /home/runner/go-build
          key: go-test-${{ hashFiles('go.sum') }}
          restore-keys: go-test-
      - run: lab/go.sh test -race ./...
  store:
    # The store tests need a real btrfs filesystem (a loop-mounted image).
    name: store tests on btrfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go-mod
            /home/runner/go-build
          key: go-store-${{ hashFiles('go.sum') }}
          restore-keys: go-store-
      - run: lab/test-store.sh
  fuzz:
    # Each fuzz test for 20 s: the seeds run with the unit tests already.
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go-mod
            /home/runner/go-build
          key: go-fuzz-${{ hashFiles('go.sum') }}
          restore-keys: go-fuzz-
      - run: lab/fuzz.sh
  checks:
    name: lint, generated code, modules, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go-mod
            /home/runner/go-build
          key: go-checks-${{ hashFiles('go.sum') }}
          restore-keys: go-checks-
      # golangci-lint, shellcheck and hadolint.
      - run: lab/lint.sh
      # The store's queries are generated from internal/store/index/*.sql.
      - run: lab/sqlc.sh diff
      - run: lab/go.sh mod tidy -diff
      - run: lab/go.sh run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  images:
    # The daemon's binaries and the box image build, and have no known
    # vulnerability with a fix. T3's image (fern-t3) builds T3 from source
    # and is left to the lab.
    name: image ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fern, fern-box]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/Dockerfile
          target: ${{ matrix.target }}
          tags: ${{ matrix.target }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.target }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
