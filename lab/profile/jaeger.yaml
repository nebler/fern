# Jaeger, for lab/profile.sh only: it collects the traces of the daemon,
# kubelet and containerd while a profile runs, and is removed after. It is
# on the node's network, so the node's own processes reach it at
# localhost:4317 and the daemon at the node's address (4318). Traces are in
# memory only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: fern-system
  labels: {app.kubernetes.io/name: jaeger, app.kubernetes.io/part-of: fern}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: jaeger}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jaeger, app.kubernetes.io/part-of: fern}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          env:
            # Its receivers listen on localhost unless told otherwise.
            - {name: JAEGER_LISTEN_HOST, value: 0.0.0.0}
          ports:
            - {containerPort: 4317, name: otlp-grpc}
            - {containerPort: 4318, name: otlp-http}
            - {containerPort: 16686, name: ui}
          readinessProbe:
            httpGet: {path: /, port: 16686}
            periodSeconds: 2
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 512Mi}
