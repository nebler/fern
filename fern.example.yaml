workspace:
  name: demo
  image: fern/opencode:dev
  repo: .
  memory: 8Gi
  env: {}
  # Draft-PR publication is disabled until both immutable values are set.
  # github:
  #   # installationId is required only when durable tasks are enabled.
  #   # installationId: 987654321
  #   repository:
  #     id: 123456789
  #     fullName: owner/repository
# Durable tasks are disabled unless this complete policy and the GitHub App
# installation ID above are explicitly configured. With remoteOrigin set, first
# create host credentials from the operator-only /fern/control onboarding link.
# tasks:
#   agent: build
#   model:
#     provider: replace-with-provider-id
#     id: replace-with-model-id
#   attemptTimeout: 30m
#   leaseDuration: 2m
#   budget:
#     maxTurns: 100
#   # Optional. No verification command is inferred from repository contents.
#   verification:
#     checkName: repository-tests
#     argv: [/usr/bin/make, test]
#     workingDirectory: ""
#     timeout: 15m
#     environment:
#       CI: "true"
#     outputBytes: 65536
control:
  password: ${FERN_CONTROL_PASSWORD}
idle:
  after: 10m
proxy:
  listen: 127.0.0.1:8080
  operatorListen: 127.0.0.1:8081
  # Phone publication requires the exact canonical root, with no trailing slash:
  # remoteOrigin: https://this-host.example.ts.net
