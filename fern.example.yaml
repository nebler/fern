workspace:
  name: demo
  image: fern/opencode:dev
  repo: .
  memory: 8Gi
  env: {}
  # Workspace GitHub access is disabled unless this explicit binding is set.
  # github:
  #   mode: workspace-gh
  #   hostname: github.com
  #   repository:
  #     id: 123456789
  #     fullName: owner/repository
# Durable tasks are disabled unless this complete policy and GitHub binding are
# explicitly configured. `workspace-gh` uses persistent authentication inside
# the workspace. `github-app-broker` additionally requires installationId and
# host credentials created from the operator-only onboarding link.
# tasks:
#   agent: build
#   model:
#     provider: replace-with-provider-id
#     id: replace-with-model-id
#   attemptTimeout: 30m
#   leaseDuration: 2m
#   # Optional pair. Pins one local source image; external distribution still
#   # requires promotion to a registry digest.
#   backgroundImage: fern/opencode-background-source:dev
#   backgroundImageID: sha256:replace-with-64-lowercase-hex-digits
#   # Required with backgroundImage. Fern only binds this loopback listener;
#   # the operator separately publishes its exact private HTTPS port.
#   backgroundRoute:
#     listen: 127.0.0.1:8443
#     origin: https://this-host.example.ts.net:8443
#   # Optional and explicit. Disposable runs never inherit workspace.env.
#   backgroundEnvironment:
#     OPENAI_API_KEY: ${OPENAI_API_KEY}
#   budget:
#     maxTurns: 100
#   # Optional. No verification command is inferred from repository contents.
#   verification:
#     checkName: repository-tests
#     argv: [/usr/bin/make, test]
#     workingDirectory: ""
#     timeout: 15m
#     environment:
#       CI: "true"
#     outputBytes: 65536
control:
  password: ${FERN_CONTROL_PASSWORD}
idle:
  after: 10m
  # stop = graceful docker stop (default, ~seconds to wake).
  # freeze = cgroup freezer: the process stays resident and wakes in
  # milliseconds, at the cost of retaining resident memory while suspended.
  mode: stop
proxy:
  listen: 127.0.0.1:8080
  operatorListen: 127.0.0.1:8081
  # Phone publication requires the exact canonical root, with no trailing slash:
  # remoteOrigin: https://this-host.example.ts.net
