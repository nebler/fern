workspace:
  name: demo
  repo: /srv/fern/repository
  github:
    mode: github-app-broker
    hostname: github.com
    installationId: 12345678
    repository:
      id: 123456789
      fullName: owner/repository
tasks:
  agent: build
  model:
    provider: replace-with-provider-id
    id: replace-with-model-id
  attemptTimeout: 30m
  leaseDuration: 2m
  backgroundImage: fern/opencode-background-source:dev
  backgroundImageID: sha256:REPLACE_WITH_QUALIFIED_LOCAL_IMAGE_ID
  backgroundRoute:
    listen: 127.0.0.1:8443
    origin: https://this-host.example.ts.net:8443
  budget:
    maxTurns: 100
  verification:
    checkName: repository-tests
    argv: [/usr/bin/make, test]
    workingDirectory: ""
    timeout: 15m
    environment:
      CI: "true"
    outputBytes: 65536
control:
  password: ${FERN_CONTROL_PASSWORD}
proxy:
  listen: 127.0.0.1:8080
  operatorListen: 127.0.0.1:8081
  remoteOrigin: https://this-host.example.ts.net
