# Optional keys and their defaults: workspace.name (default), tasks.agent
# (build), tasks.runTimeout (30m), proxy.listen (127.0.0.1:8080),
# proxy.operatorListen (127.0.0.1:8081). The control password is read from
# FERN_CONTROL_PASSWORD in the protected environment file, never from here.
workspace:
  repo: /srv/fern/repository
  github:
    installationId: 12345678
    repository:
      id: 123456789
      fullName: owner/repository
tasks:
  # Operator-provisioned Linux XFS project quota; never durable DB/CAS storage.
  runtimeStorageRoot: /var/lib/fern-runtime
  model:
    provider: replace-with-provider-id
    id: replace-with-model-id
  backgroundImage: fern/opencode-background-source:dev
  backgroundImageID: sha256:REPLACE_WITH_QUALIFIED_LOCAL_IMAGE_ID
  backgroundRoute:
    listen: 127.0.0.1:8443
    origin: https://this-host.example.ts.net:8443
proxy:
  remoteOrigin: https://this-host.example.ts.net
