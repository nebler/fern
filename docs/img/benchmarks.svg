<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>How long things take: snapshot 12 ms, revert 86 ms, wake 220 ms, new thread 35 ms</title>
  <rect width="1200" height="420" rx="24" fill="#fafaf9"/>
  <text x="80" y="96" font-size="34" font-weight="600" fill="#1c1917">How long it takes.</text>
  <text x="80" y="140" font-size="22" fill="#78716c">Medians on a 4-core ARM VPS, every box in gVisor.</text>
  <g text-anchor="start">
    <text x="80" y="270" font-size="64" font-weight="600" fill="#1c1917">12<tspan font-size="30" fill="#78716c"> ms</tspan></text>
    <text x="80" y="316" font-size="20" fill="#78716c">snapshot a turn</text>
    <text x="350" y="270" font-size="64" font-weight="600" fill="#16a34a">86<tspan font-size="30" fill="#78716c"> ms</tspan></text>
    <text x="350" y="316" font-size="20" fill="#78716c">revert code + database</text>
    <text x="640" y="270" font-size="64" font-weight="600" fill="#1c1917">220<tspan font-size="30" fill="#78716c"> ms</tspan></text>
    <text x="640" y="316" font-size="20" fill="#78716c">wake a sleeping box</text>
    <text x="920" y="270" font-size="64" font-weight="600" fill="#1c1917">35<tspan font-size="30" fill="#78716c"> ms</tspan></text>
    <text x="920" y="316" font-size="20" fill="#78716c">start a new thread</text>
  </g>
</svg>
