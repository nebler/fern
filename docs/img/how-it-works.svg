<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Every turn is a snapshot; revert brings back the code and the database</title>
  <rect width="1200" height="420" rx="24" fill="#fafaf9"/>
  <text x="80" y="96" font-size="34" font-weight="600" fill="#1c1917">Every turn is a snapshot.</text>
  <text x="80" y="140" font-size="22" fill="#78716c">Revert brings back the code and the database.</text>

  <path d="M140 290H1060" stroke="#d6d3d1" stroke-width="3"/>
  <g font-size="18" fill="#78716c" text-anchor="middle">
    <circle cx="200" cy="290" r="14" fill="#1c1917"/><text x="200" y="340">turn 1</text>
    <circle cx="460" cy="290" r="14" fill="#1c1917"/><text x="460" y="340">turn 2</text>
    <circle cx="720" cy="290" r="14" fill="#1c1917"/><text x="720" y="340">turn 3</text>
    <circle cx="980" cy="290" r="14" fill="#fff" stroke="#a8a29e" stroke-width="3"/><text x="980" y="340">turn 4</text>
  </g>
  <path d="M712 268C680 200 500 200 470 262" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <path d="M462 248L470 266L486 254" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="590" y="200" font-size="20" font-weight="600" fill="#16a34a" text-anchor="middle">revert · 0.1 s</text>
</svg>
