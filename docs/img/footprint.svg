<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>What it costs: 50 MiB per awake box, 20 awake boxes tested on 8 GB, no CPU while a thread sleeps, 11 MiB for the daemon</title>
  <rect width="1200" height="420" rx="24" fill="#fafaf9"/>
  <text x="80" y="96" font-size="34" font-weight="600" fill="#1c1917">What it costs.</text>
  <text x="80" y="140" font-size="22" fill="#78716c">One 8 GB, 4-core ARM VPS.</text>
  <text x="80" y="270" font-size="64" font-weight="600" fill="#1c1917">50<tspan font-size="30" fill="#78716c"> MiB</tspan></text>
  <text x="80" y="316" font-size="20" fill="#78716c">per awake box</text>
  <text x="350" y="270" font-size="64" font-weight="600" fill="#1c1917">20</text>
  <text x="350" y="316" font-size="20" fill="#78716c">awake boxes, tested at once</text>
  <text x="640" y="270" font-size="64" font-weight="600" fill="#16a34a">0<tspan font-size="30" fill="#78716c"> CPU</tspan></text>
  <text x="640" y="316" font-size="20" fill="#78716c">while a thread sleeps</text>
  <text x="920" y="270" font-size="64" font-weight="600" fill="#1c1917">11<tspan font-size="30" fill="#78716c"> MiB</tspan></text>
  <text x="920" y="316" font-size="20" fill="#78716c">the whole daemon</text>
</svg>
