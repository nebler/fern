# Fern for the local lab: the daemon (with its CSI node plugin) on every node,
# and a namespace for boxes. Helm replaces this in week 5.
apiVersion: v1
kind: Namespace
metadata:
  name: fern-system
  labels:
    app.kubernetes.io/part-of: fern
---
# Boxes run here, apart from the privileged daemon.
apiVersion: v1
kind: Namespace
metadata:
  name: fern-boxes
  labels:
    app.kubernetes.io/part-of: fern
---
# Only the daemon may connect to a box: not other boxes, not other pods.
# Kubelet's probes come from the node, which this doesn't block.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: boxes-from-daemon-only
  namespace: fern-boxes
  labels:
    app.kubernetes.io/part-of: fern
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fern-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: fern
      ports:
        - port: 7070
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: fern.dev
  labels:
    app.kubernetes.io/part-of: fern
spec:
  attachRequired: false
  podInfoOnMount: true # the plugin gets the pod's identity with every mount
  volumeLifecycleModes: [Ephemeral]
  fsGroupPolicy: None # never chown a workspace on mount
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fern
  namespace: fern-system
  labels:
    app.kubernetes.io/part-of: fern
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fern
  namespace: fern-boxes
  labels:
    app.kubernetes.io/part-of: fern
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, delete] # delete: a failed pod, so it is replaced
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fern
  namespace: fern-boxes
  labels:
    app.kubernetes.io/part-of: fern
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fern
subjects:
  - kind: ServiceAccount
    name: fern
    namespace: fern-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fern
  namespace: fern-system
  labels:
    app.kubernetes.io/part-of: fern
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fern
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fern
        app.kubernetes.io/part-of: fern
    spec:
      serviceAccountName: fern
      containers:
        - name: fern
          image: fern:dev
          imagePullPolicy: Never # the lab imports its images
          args: [daemon]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Requests keep the daemon out of the BestEffort class, which is
          # the first to be starved or evicted when boxes are busy.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            privileged: true # btrfs ioctls and bind mounts
          volumeMounts:
            - name: pool
              mountPath: /var/lib/fern
            - name: plugin
              mountPath: /csi
            - name: socket
              mountPath: /run/fern
            # Bind mounts made here must reach kubelet and the box containers.
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
        - name: registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/fern.dev/csi.sock
          volumeMounts:
            - name: plugin
              mountPath: /csi
            - name: registration
              mountPath: /registration
      volumes:
        - name: pool
          hostPath:
            path: /var/lib/fern
            type: Directory
        - name: plugin
          hostPath:
            path: /var/lib/kubelet/plugins/fern.dev
            type: DirectoryOrCreate
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: registration
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: socket
          hostPath:
            path: /run/fern
            type: DirectoryOrCreate
