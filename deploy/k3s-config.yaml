# k3s's settings for a Fern node: /etc/rancher/k3s/config.yaml. lab/up.sh
# uses it, and so does the VPS (docs/engine-local.md §1.2).
#
# Off: what Fern doesn't use. Its volumes are inline CSI, not claims
# (local-storage), and T3 is reached on a NodePort (servicelb, traefik).
# Network policies and CoreDNS stay: box isolation and DNS need them.
disable:
  - traefik
  - metrics-server
  - servicelb
  - local-storage
kubelet-arg:
  - pod-max-pids=4096
  # Memory for k3s, containerd and the system, which boxes can't be
  # scheduled into. It protects the node; it doesn't save memory.
  - kube-reserved=cpu=200m,memory=768Mi
  - system-reserved=cpu=100m,memory=256Mi
  # Under memory pressure kubelet evicts pods before the node runs out. The
  # disk thresholds are kubelet's defaults, which naming any threshold drops.
  - eviction-hard=memory.available<500Mi,nodefs.available<10%,imagefs.available<15%,nodefs.inodesFree<5%
  - eviction-soft=memory.available<1Gi
  - eviction-soft-grace-period=memory.available=1m
