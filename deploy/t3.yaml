# T3 Code's server for one person, on Fern's node (lab/build.sh t3 builds and
# deploys it). It sees the pool at the same path as the daemon and the boxes, so a
# worktree has one path everywhere, and reaches the daemon through its socket.
# The T3 app on the Mac pairs with it through the NodePort. On a VPS the
# NodePort listens on every interface: firewall it or use a tailnet, since
# whoever reaches T3 uses its owner's subscription (architecture §13.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3
  namespace: fern-system
  labels:
    app.kubernetes.io/part-of: fern
spec:
  strategy:
    type: Recreate # one server per T3 home
  selector:
    matchLabels:
      app.kubernetes.io/name: t3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3
        app.kubernetes.io/part-of: fern
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      initContainers:
        # T3's home is the pool itself, so its worktrees (<home>/worktrees)
        # are where Fern expects workspaces. Its own state (userdata, caches,
        # tools) and the projects' main repositories sit beside envs/ and
        # worktrees/, owned by T3's user: Fern never snapshots them.
        - name: dirs
          image: fern-t3:dev
          imagePullPolicy: Never
          command: [install, -d, -o, "1000", -g, "1000", /var/lib/fern/userdata, /var/lib/fern/caches,
            /var/lib/fern/tools, /var/lib/fern/repos, /var/lib/fern/worktrees]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: pool
              mountPath: /var/lib/fern
        # Fern's defaults for T3, where the person hasn't chosen: a new thread
        # is a New worktree, so it gets an environment (a Local thread has no
        # box or database), and deleting a thread removes its worktree, which
        # takes its environment with it (architecture §15). A choice made in
        # T3's settings stays.
        - name: settings
          image: fern-t3:dev
          imagePullPolicy: Never
          command:
            - node
            - -e
            - |
              const fs = require("fs"), f = "/var/lib/fern/userdata/settings.json";
              let s = {};
              try { s = JSON.parse(fs.readFileSync(f, "utf8")); } catch (e) { if (e.code !== "ENOENT") throw e; }
              const before = JSON.stringify(s);
              s.defaultThreadEnvMode ??= "worktree";
              s.storageCleanup ??= {};
              s.storageCleanup.worktreeOnDelete ??= true;
              if (JSON.stringify(s) !== before) {
                fs.writeFileSync(f + ".tmp", JSON.stringify(s, null, 2) + "\n");
                fs.renameSync(f + ".tmp", f);
              }
          volumeMounts:
            - name: pool
              mountPath: /var/lib/fern
      containers:
        - name: t3
          image: fern-t3:dev
          imagePullPolicy: Never
          args: [serve, --host=0.0.0.0, --port=3773]
          env:
            - name: T3CODE_HOME
              value: /var/lib/fern
            # The checkpoint hook's pool: T3's worktrees must be its worktrees/.
            - name: FERN_POOL
              value: /var/lib/fern
            # Launch and checkpoint timings contain paths, IDs and durations only.
            - name: FERN_TIMING
              value: "1"
            # For the Claude T3 runs itself, outside environments (its probes);
            # boxes get the same login from their own namespace's copy.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: claude-login, key: token, optional: true}
          # Ready once it answers, so a rollout ends when T3 serves, not when
          # its process starts.
          readinessProbe:
            httpGet: {path: /.well-known/t3/environment, port: 3773}
            periodSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: pool
              mountPath: /var/lib/fern
            - name: socket
              mountPath: /run/fern
      volumes:
        - name: pool
          hostPath:
            path: /var/lib/fern
            type: Directory
        - name: socket
          hostPath:
            path: /run/fern
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: t3
  namespace: fern-system
  labels:
    app.kubernetes.io/part-of: fern
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: t3
  ports:
    - port: 3773
      nodePort: 30773
